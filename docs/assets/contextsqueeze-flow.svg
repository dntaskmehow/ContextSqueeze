<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ContextSqueeze flow</title>
  <desc id="desc">A diagram showing a raw JSON payload reduced to a smaller set of keys with a truncation flag.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c9cff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#7dd3fc" stroke-width="1">
    <path d="M0 60 H1200 M0 140 H1200 M0 220 H1200 M0 300 H1200 M0 380 H1200 M0 460 H1200"/>
    <path d="M120 0 V520 M300 0 V520 M480 0 V520 M660 0 V520 M840 0 V520 M1020 0 V520"/>
  </g>

  <text x="80" y="72" fill="#e5e7eb" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">ContextSqueeze</text>
  <text x="80" y="102" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="16">Payload reduction for constrained context windows</text>

  <g filter="url(#shadow)">
    <rect x="80" y="150" width="270" height="220" rx="18" fill="#111827" stroke="#2d3748"/>
    <text x="110" y="185" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Raw JSON</text>
    <g font-family="Consolas, monospace" font-size="16" fill="#e5e7eb">
      <text x="110" y="220">{</text>
      <text x="130" y="248">"id": 101,</text>
      <text x="130" y="278">"title": "Deploy patch",</text>
      <text x="130" y="308">"status": "queued",</text>
      <text x="130" y="338">"owner": "team-alpha",</text>
      <text x="130" y="368">"notes": "Follow up"</text>
      <text x="110" y="392">}</text>
    </g>
  </g>

  <g>
    <rect x="430" y="225" width="160" height="70" rx="35" fill="url(#accent)"/>
    <text x="470" y="268" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">squeeze</text>
    <path d="M390 260 H430" stroke="url(#accent)" stroke-width="4"/>
    <path d="M590 260 H660" stroke="url(#accent)" stroke-width="4"/>
    <path d="M660 260 L690 260" stroke="url(#accent)" stroke-width="4"/>
    <path d="M690 260 L690 320" stroke="url(#accent)" stroke-width="4"/>
    <path d="M690 320 L735 320" stroke="url(#accent)" stroke-width="4"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="700" y="150" width="430" height="220" rx="18" fill="#111827" stroke="#2d3748"/>
    <text x="730" y="185" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Optimized output</text>
    <g font-family="Consolas, monospace" font-size="16" fill="#e5e7eb">
      <text x="730" y="220">{</text>
      <text x="750" y="248">"id": 101,</text>
      <text x="750" y="278">"title": "Deploy patch",</text>
      <text x="750" y="308">"status": "queued",</text>
      <text x="750" y="338">"_truncated": true</text>
      <text x="730" y="392">}</text>
    </g>
  </g>

  <g>
    <rect x="80" y="430" width="1050" height="48" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="110" y="460" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Keep only the first N keys • mark omitted data explicitly • preserve structure for downstream tools</text>
  </g>
</svg>
